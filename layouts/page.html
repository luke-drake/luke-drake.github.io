{{ define "main" }}
<header class="page-head">
  <div class="wrap">
    {{ with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}
  </div>
</header>
<article class="wrap prose">
  {{ .Content }}
</article>
{{ end }}
