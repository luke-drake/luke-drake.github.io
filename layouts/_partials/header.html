<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand__name">{{ site.Params.author }}</span>
      <span class="brand__tag">{{ site.Params.tagline }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
    <label for="nav-toggle" class="nav-toggle__btn" aria-hidden="true"><span></span><span></span><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
